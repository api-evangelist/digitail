        in: query
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                remove_irrelevant_tasks:
                  type: boolean
                discount:
                  type:
                  - number
                  - 'null'
                  format: float
                discount_percentage:
                  type:
                  - number
                  - 'null'
                  format: float
                discount_type:
                  type:
                  - string
                  - 'null'
                  enum:
