                        type: integer
                      quantity:
                        type: number
                        format: float
                      price:
                        type: number
                        format: float
                      unit_price:
                        type: number
                        format: float
                      vat:
                        type: number
                        format: float
                        deprecated: true
                        description: Deprecated for lines referencing a catalog item — use `tax_rate_ids`. Still required on write-in lines (no `product_id` / `service_package_id`).
                      tax_rate_ids:
                        type: array
                        description: Tax rate ids to apply. Takes precedence over `vat` when present. Send at most the clinic's `max_tax_rates` (1 today).
                        items:
                          type: integer
                        example:
                        - 57
                      vet_id:
                        type: number
                        format: float
                      name:
                        type: string
                      original_price:
                        type: number
                        format: float
                      is_checkout_bought:
                        type: boolean
                      discount:
                        type: number
