                  - percentage
                discount_reason:
                  type:
                  - object
                  - 'null'
                  properties:
                    reason:
                      type:
                      - string
                      - 'null'
                    is_private:
                      type: string
                      enum:
                      - public
                      - private
                predefined_discounts:
                  type: array
                  items:
                    type: integer
                sold_products:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: integer
                        description: ID of an existing treatment. Omit or set to null for new treatments.
                      product_id:
                        type: integer
                        description: 'Product to sell. Cannot refer to a discontinued (soft-deleted) product when creating a new treatment.

                          '
                      vet_id:
                        type: number
                        format: float
                      unit_id:
                        type: string
                        enum:
                        - unit
                        - subunit
                        description: Cannot be changed for an existing treatment whose product is discontinued.
                      unit:
                        type: string
                      quantity:
                        type: number
                        format: float
                        description: Cannot be changed for an existing treatment whose product is discontinued.
                      sale_price:
                        type: number
                        format: float
                      sale_price_with_vat:
                        type: number
                        format: float
                      vat:
                        type: number
                        format: float
                        deprecated: true
                        description: Deprecated for lines referencing a catalog item — use `tax_rate_ids`. Still required on write-in lines (no `product_id` / `service_package_id`).
                      tax_rate_ids:
                        type: array
                        description: Tax rate ids to apply. Takes precedence over `vat` when present. Send at most the clinic's `max_tax_rates` (1 today).
                        items:
                          type: integer
                        example:
                        - 57
                      price:
                        type: number
                        format: float
                      sub_price:
                        type: number
                        format: float
                      product_name:
                        type: string
                      label:
                        type: string
                      recommendations:
                        type: string
                      is_checkout_bought:
                        type: boolean
                      fixed_fee:
                        type: number
                        format: float
                      include_fixed_fee:
                        type: boolean
                      discount_reason:
                        type:
                        - object
                        - 'null'
                        properties:
                          reason:
                            type:
                            - string
                            - 'null'
                          is_private:
                            type: string
                            enum:
                            - public
                            - private
                      discount:
                        type: number
                        format: float
                      discount_percentage:
                        type: number
                        format: float
                      discount_type:
                        type: string
                        enum:
                        - fixed
                        - percentage
                      price_threshold_type:
                        type: string
                        enum:
                        - minimum
                        - maximum
                      purchase_order_items:
                        type: array
                        description: 'For an existing treatment whose product is discontinued, the set of batch IDs and their quantities must exactly match the stored values. Any addition, removal, or quantity change results in a 422.

                          '
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              description: ID of the purchase order item (batch).
                            quantity:
                              type: number
                              format: float
                sold_services:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
