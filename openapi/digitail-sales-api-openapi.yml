                                properties:
                                  id:
                                    type: integer
                                    description: ID of the purchase order item (batch).
                                  quantity:
                                    type: number
                                    format: float
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
