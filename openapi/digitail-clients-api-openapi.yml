openapi: 3.2.0
info:
  title: Digitail Clients API
  description: Digitail API
  contact:
    email: developer@digitail.io
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: 1.0.0
servers:
- url: https://developer.digitail.io
  description: Sandbox server (uses test data)
- url: https://vet.digitail.io
  description: Production server (uses live data)
security:
- passport: []
- Bearer: []
tags:
- name: Clients
paths:
  /api/v1/clients/{client}/payment-provider-cards:
    get:
      tags:
      - Clients
      description: Get saved payment provider cards.
      parameters:
      - name: client
        in: path
        description: Client id OR {clinic-id}-{pet-parent-id} tuple.
        required: true
        schema:
          type: string
        examples:
          clientId:
            value: '123'
            summary: Client id
          clinicIdAndPetParentId:
            value: 766-371232
            summary: Clinic id and pet parent id tuple
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      title: Payment Provider Card
                      properties:
                        id:
                          type: string
                          example: pi_fake
                        brand:
                          $ref: '#/paths/~1api~1v1~1charges/post/requestBody/content/application~1json/schema/properties/card_brand'
                        last4:
                          type: string
                          example: '4242'
                        exp_month:
                          type: integer
                          example: 12
                        exp_year:
                          type: integer
                          example: 2022
                  links:
                    $ref: '#/paths/~1api~1v1~1pets/get/responses/200/content/application~1json/schema/properties/links'
                  meta:
                    $ref: '#/paths/~1api~1v1~1pets/get/responses/200/content/application~1json/schema/properties/meta'
        '400':
          $ref: '#/paths/~1api~1v1~1pets/get/responses/400'
        '401':
          $ref: '#/paths/~1api~1v1~1pets/get/responses/401'
        '429':
          $ref: '#/paths/~1api~1v1~1pets/get/responses/429'
      summary: Get api clients by client payment provider cards
      x-summary-source: derived
      operationId: getApiV1ClientsByClientPaymentProviderCards
      x-operation-id-source: derived
  /api/v1/clients/{client}/add-payment-provider-card-link:
    post:
      tags:
      - Clients
      description: Get add payment provider card link (that you can use to redirect) for a client.
      parameters:
      - name: client
        in: path
        description: Client id OR {clinic-id}-{pet-parent-id} tuple.
        required: true
        schema:
          type: string
        examples:
          clientId:
            value: '123'
            summary: Client id
          clinicIdAndPetParentId:
            value: 766-371232
            summary: Clinic id and pet parent id tuple
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                title: Payment Provider Card Link
                properties:
                  url:
                    type: string
                    example: https://stripe.com/setup-intents/si_1234567890abcdefg
        '400':
          $ref: '#/paths/~1api~1v1~1pets/get/responses/400'
        '401':
          $ref: '#/paths/~1api~1v1~1pets/get/responses/401'
        '429':
          $ref: '#/paths/~1api~1v1~1pets/get/responses/429'
      summary: Create api clients by client add payment provider card link
      x-summary-source: derived
      operationId: postApiV1ClientsByClientAddPaymentProviderCardLink
      x-operation-id-source: derived
  /api/v1/clients/{client}/payment-provider-cards/{id}:
    delete:
      tags:
      - Clients
      description: Deletes a client's payment provider card
      parameters:
      - $ref: '#/paths/~1api~1v1~1sales/delete/parameters/0'
      responses:
        '204':
          $ref: '#/paths/~1api~1v1~1sales/delete/responses/204'
        '400':
          $ref: '#/paths/~1api~1v1~1pets/get/responses/400'
        '401':
          $ref: '#/paths/~1api~1v1~1pets/get/responses/401'
        '429':
          $ref: '#/paths/~1api~1v1~1pets/get/responses/429'
      summary: Delete api clients by client payment provider cards by id
      x-summary-source: derived
      operationId: deleteApiV1ClientsByClientPaymentProviderCardsById
      x-operation-id-source: derived
components:
  securitySchemes:
    passport:
      type: oauth2
      description: Laravel passport oauth2 security.
      flows:
        authorizationCode:
          authorizationUrl: https://developer.digitail.io/oauth/authorize
          tokenUrl: https://developer.digitail.io/oauth/token
          refreshUrl: https://developer.digitail.io/oauth/token
    Bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
x-provenance:
  method: harvested
  publisher: Digitail
  source: https://developer.digitail.io/api-docs
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
