openapi: 3.2.0
info:
  title: Digitail Breeds API
  description: Digitail API
  contact:
    email: developer@digitail.io
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: 1.0.0
servers:
- url: https://developer.digitail.io
  description: Sandbox server (uses test data)
- url: https://vet.digitail.io
  description: Production server (uses live data)
security:
- passport: []
- Bearer: []
tags:
- name: Breeds
  description: Get list of breeds
paths:
  /api/v1/breeds:
    get:
      tags:
      - Breeds
      summary: List all Breeds
      description: 'Permissions needed: NONE

        Returns list of breeds'
      security: []
      parameters:
      - name: filter[species_id]
        in: query
        description: Id of the related Species
        required: false
        style: form
        explode: false
        schema:
          type: integer
      - name: filter[search]
        in: query
        description: search by name
        required: false
        schema:
          type: string
      - $ref: '#/paths/~1api~1v1~1tags/get/parameters/5'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      title: Breed
                      description: The breed of the pet
                      properties:
                        id:
                          type: integer
                          example: 1
                        label:
                          type: string
                          example: Bull Terrier
                        breed:
                          type: string
                          description: Breed translated in the vet language
                          example: Bull Terrier
                        species_id:
                          type: integer
                          example: 1
                  links:
                    $ref: '#/paths/~1api~1v1~1pets/get/responses/200/content/application~1json/schema/properties/links'
                  meta:
                    $ref: '#/paths/~1api~1v1~1pets/get/responses/200/content/application~1json/schema/properties/meta'
        '429':
          $ref: '#/paths/~1api~1v1~1pets/get/responses/429'
      operationId: getApiV1Breeds
      x-operation-id-source: derived
components:
  securitySchemes:
    passport:
      type: oauth2
      description: Laravel passport oauth2 security.
      flows:
        authorizationCode:
          authorizationUrl: https://developer.digitail.io/oauth/authorize
          tokenUrl: https://developer.digitail.io/oauth/token
          refreshUrl: https://developer.digitail.io/oauth/token
    Bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
