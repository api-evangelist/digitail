openapi: 3.2.0
info:
  title: Digitail Pets API
  description: Digitail API
  contact:
    email: developer@digitail.io
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: 1.0.0
servers:
- url: https://developer.digitail.io
  description: Sandbox server (uses test data)
- url: https://vet.digitail.io
  description: Production server (uses live data)
security:
- passport: []
- Bearer: []
tags:
- name: Pets
  description: Get list of pets (patients), pet details, manage pet weight entries
paths:
  /api/v1/patients/{pet}/file-case/{fileCase}/pdf:
    get:
      tags:
      - Pets
      summary: Export Record PDF
      description: 'Permissions needed: ACCESS_PATIENTS, VIEW_CHECKUPS

        Receive a pdf file with the summary of a record'
      parameters:
      - name: pet
        in: path
        description: The id of the pet whose records are being requested
        required: true
        schema:
          type: integer
      - name: fileCase
        in: path
        description: The id of the record whose pdf is being requested
        required: true
        schema:
          type: integer
      responses:
        '200':
          title: OK PDF
          description: The response is a PDF file.
          content:
            application/pdf: {}
        '400':
          $ref: '#/paths/~1api~1v1~1pets/get/responses/400'
        '401':
          $ref: '#/paths/~1api~1v1~1pets/get/responses/401'
        '403':
          $ref: '#/paths/~1api~1v1~1pets/get/responses/403'
        '429':
          $ref: '#/paths/~1api~1v1~1pets/get/responses/429'
      operationId: getApiV1PatientsByPetFileCaseByFileCasePdf
      x-operation-id-source: derived
  /api/v1/pets:
    get:
      tags:
      - Pets
      summary: List all Pets
      description: 'Permissions needed: ACCESS_PATIENTS

        Returns list of Pets'
      parameters:
      - name: filter[clinic_id]
        in: query
        description: ID of the clinic from where the entity was created
        style: form
        explode: false
        required: true
        schema:
          type: integer
      - name: filter[vet_id]
        in: query
        description: Id of the vet that performed/owns the entity
        style: form
        explode: false
        schema:
          type: integer
      - name: filter[owner_id]
        in: query
        description: Id of the related PetParent
        style: form
        explode: false
        schema:
          type: integer
          example: 1
      - name: filter[id]
        in: query
        description: Pet ID
        required: false
        schema:
          type: integer
      - name: filter[nickname]
        in: query
        description: Pet nickname
        required: false
        schema:
          type: string
      - name: filter[updated_from]
        in: query
        description: Returns only the pets updated after this datetime (exclusive). The value must be a UTC ISO 8601 timestamp with a Z suffix, for example 2020-08-16T08:56:44.000000Z. Timezone offsets such as +02:00 are not accepted. Updated at and created at are returned in UTC in the response.
        required: false
        schema:
          type: string
          format: date-time
      - name: filter[updated_to]
        in: query
        description: Returns only the pets updated at or before this datetime (inclusive). The value must be a UTC ISO 8601 timestamp with a Z suffix, for example 2020-08-16T08:56:44.000000Z. Timezone offsets such as +02:00 are not accepted. Updated at and created at are returned in UTC in the response.
        required: false
        schema:
          type: string
          format: date-time
      - name: filter[birthday_between]
        in: query
        description: Date range for pet birthday, format is 'YYYY-MM-DD,YYYY-MM-DD' (e.g. '2021-02-01,2021-02-29'). This will return pets born between the two dates.
        schema:
          type: string
          example: 2021-02-01,2021-02-29
      - name: include
        in: query
        description: 'Additional info to include. You can use multiple, comma separated. Options: species,breed,trupanionSpecies,trupanionBreed,crossBreed,owners,clinics,vetPetRequests.clinic,patients,patients.archiveType'
        required: false
        schema:
          type: string
      - name: sort
        in: query
        description: 'Order by field(s)(ex: ''nickname,created_at,name-archived-last -> order by nickname with archived pets at the end'')'
        required: false
        schema:
          type: string
      - $ref: '#/paths/~1api~1v1~1tags/get/parameters/5'
      - name: per_page
        in: query
        description: Number of items to retrieve per page
        required: false
        schema:
          type: integer
          default: 15
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/paths/~1api~1v1~1pets/post/responses/201/content/application~1json/schema/properties/data'
                  links:
                    type: object
                    title: PaginationLinks
                    properties:
                      first:
                        type:
                        - string
                        - 'null'
                        example: null
                      last:
                        type:
                        - string
                        - 'null'
                        example: https://developer.digitail.io/api/v1/entities?page=10
                      prev:
                        type:
                        - string
                        - 'null'
                        example: null
                      next:
                        type:
                        - string
                        - 'null'
                        example: https://developer.digitail.io/api/v1/entities?page=2
                  meta:
                    type: object
                    title: PaginationMeta
                    properties:
                      current_page:
                        type: integer
                        example: 1
                      from:
                        type:
                        - integer
                        - 'null'
                        example: 1
                      last_page:
                        type: integer
                        example: 10
                      links:
                        type: array
                        items:
                          type: object
                          properties:
                            url:
                              type:
                              - string
                              - 'null'
                              example: '&laquo; Previous'
                        example:
                        - url: null
                          label: '&laquo; Previous'
                          active: false
                        - url: https://developer.digitail.io/api/v1/entities?page=1
                          label: '1'
                          active: true
                        - url: https://developer.digitail.io/api/v1/entities?page=2
                          label: Next &raquo;
                          active: true
                      path:
                        type: string
                        example: https://developer.digitail.io/api/v1/entities
                      per_page:
                        type: integer
                        example: 15
                      to:
                        type:
                        - integer
                        - 'null'
                        example: 10
                      total:
                        type: integer
                        example: 145
        '400':
          title: Bad Request
          description: The request was invalid or contained data that was not allowed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Requested filter(s) `filter1` are not allowed. Allowed filter(s) are date, query, ...
        '401':
          title: Unauthorized
          description: The authorization token is missing or invalid.
          content:
            application/json: {}
        '403':
          title: Forbidden
          description: The user is not authorized to perform the requested operation.
          content:
            application/json: {}
        '429':
          title: Too Many Requests
          description: The user has sent too many requests in a given amount of time ("rate limiting"). Max 200 requests per minute.
          content:
            application/json: {}
      operationId: getApiV1Pets
      x-operation-id-source: derived
    post:
      tags:
      - Pets
      summary: Create a Pet
      description: 'Permissions needed: CREATE_PATIENTS

        Create a pet'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              required:
              - vet_id
              - owner_id
              - clinic_id
              - birthday
              - nickname
              - species_id
              - breed_id
              - gender
              - hormonal_status
              type: object
              properties:
                clinic_id:
                  description: Clinic id.
                  type: integer
                  example: 1
                vet_id:
                  description: Vet id.
                  type: integer
                  example: 1
                owner_id:
                  description: Owner Id.
                  type: integer
                  example: 1
                nickname:
                  description: Nickname
                  type: string
                  example: Fluffy
                birthday:
                  description: Birthday (Y-m-d)
                  type: string
                  example: '2017-11-28'
                avatar:
                  description: Profile picture.
                  type: string
                  format: binary
                  example: avatar.jpg
                species_id:
                  description: Species Id.
                  type:
                  - integer
                  - 'null'
                  example: 1
                breed_id:
                  description: Breed ID.
                  type: integer
                  example: 1
                crossbreed:
                  description: Set to true if crossbreed. Do not send empty value, omit the key completely
                  type: boolean
                crossbreed_details:
                  description: Crossbreed id (see breeds endpoint) Do not send empty value, omit the key completely
                  type: string
                color:
                  description: Color
                  type: string
                  example: Pink
                color_mask:
                  description: Color mask
                  type:
                  - array
                  - 'null'
                  items:
                    type: integer
                    example: 1
                distinctive_marks:
                  description: Distinctive marks
                  type: string
                  example: One spot on right ear
                gender:
                  description: Gender
                  type: string
                  enum:
                  - male
                  - female
                  - unknown
                observations:
                  description: Observations (Pet notes)
                  type:
                  - string
                  - 'null'
                chip_number:
                  description: Chip number
                  type:
                  - string
                  - 'null'
                  example: '123456789'
                microchip_location:
                  description: Microchip  Location
                  type:
                  - string
                  - 'null'
                  example: Neck
                insurance_number:
                  description: Insurance Number
                  type:
                  - string
                  - 'null'
                  example: '123456789'
                insurance_provider:
                  description: Insurance Provider
                  type:
                  - string
                  - 'null'
                  example: Petplan
                policy_id:
                  description: Policy ID
                  type:
                  - string
                  - 'null'
                  example: POLICY-123
                passport:
                  description: Passport
                  type:
                  - string
                  - 'null'
                  example: '123456789'
                description:
                  description: Description
                  type:
                  - string
                  - 'null'
                constitution:
                  description: Constitution
                  type: string
                conformation:
                  description: Conformation
                  type: string
                allergies:
                  description: Allergies
                  type: string
                blood_type_id:
                  description: Blood Type Id (see blood-types endpoint) Do not send empty value, omit the key completely
                  type: integer
                hormonal_status:
                  description: Hormonal Status (0=neutered,1=normal,2=unknown)
                  type: integer
                  enum:
                  - 0
                  - 1
                  - 2
      responses:
        '201':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    title: Pet
                    description: A pet is an individual entity unique in all of Figitail. A pet can have a single PetParent, multiple contact persons and can be present on multiple clinics. The linkage between a pet and a clinics is called a patient.
                    properties:
                      id:
                        type: integer
                        example: 1
                      nickname:
                        type: string
                        example: Fritz
                      species_id:
                        type: string
                        example: '1'
                      breed_id:
                        type: string
                        example: '1'
                      trupanion_species:
                        type:
                        - object
                        - 'null'
                        description: Trupanion species mapping. Present when include=trupanionSpecies is used.
                        properties:
                          id:
                            type: integer
                            example: 1
                          external_id:
                            type: integer
                            example: 1
                          name:
                            type: string
                            example: Dog
                      trupanion_breed:
                        type:
                        - object
                        - 'null'
                        description: Trupanion breed mapping. Present when include=trupanionBreed is used.
                        properties:
                          id:
                            type: integer
                            example: 1
                          external_id:
                            type: integer
                            example: 101
                          name:
                            type: string
                            example: Golden Retriever
                      observations:
                        type:
                        - string
                        - 'null'
                        example: ''
                      gender:
                        type: string
                        enum:
                        - male
                        - female
                        - unknown
                        example: male
                      microchip:
                        type:
                        - string
                        - 'null'
                        example: null
                      crossbreed:
                        type: string
                        enum:
                        - '0'
                        - '1'
                        example: '0'
                      crossbreed_details_id:
                        type:
                        - integer
                        - 'null'
                        example: null
                      crossbreed_details:
                        type: object
                        properties:
                          id:
                            type: integer
                          label:
                            type: string
                          breed:
                            type: string
                          species_id:
                            type: integer
                      color:
                        type: string
                        example: NavajoWhite
                      distinctive_marks:
                        type: string
                        example: ''
                      birthday:
                        type: string
                        format: date
                        example: '1983-03-29'
                      gender_string:
                        type:
                        - string
                        - 'null'
                        example: null
                      chip_number:
                        type:
                        - string
                        - 'null'
                        example: null
                      microchip_location:
                        type:
                        - string
                        - 'null'
                        example: null
                      insurance_number:
                        type:
                        - string
                        - 'null'
                        example: null
                      passport:
                        type:
                        - string
                        - 'null'
                        example: ''
                      profile_picture:
                        type:
                        - string
                        - 'null'
                        example: https://dev-1-public-digitail.s3.eu-central-1.amazonaws.com/ionut/uploads/KXy8Rlv2vluiZYqwRCy2
                      description:
                        type:
                        - string
                        - 'null'
                        example: Lorem ipsum
                      constitution:
                        type:
                        - string
                        - 'null'
                        example: null
                      conformation:
                        type:
                        - string
                        - 'null'
                        example: null
                      weight:
                        type:
                        - string
                        - 'null'
                        example: null
                      weight_evolution:
                        type:
                        - integer
                        - 'null'
                        enum:
                        - 0
                        - 1
                        - -1
                      allergies:
                        type:
                        - string
                        - 'null'
                        example: null
                      nr_recs:
                        type:
                        - integer
                        - 'null'
                        example: null
                      blood_type:
                        type:
                        - string
                        - 'null'
                        example: null
                      hormonal_status:
                        type: integer
                        enum:
                        - 0
                        - 1
                        - 2
                        example: 0
                        description: '0: ''Unknown'' 1: ''Intact'' 2: ''Neutered''

                          '
                      age:
                        type: string
                        example: 38 Years, 3 Months, 19 Days
                      age_breakdown:
                        type: object
                        properties:
                          years:
                            type: integer
                            example: 38
                          months:
                            type: integer
                            example: 3
                          days:
                            type: integer
                            example: 19
                      patientNumber:
                        type: string
                        example: 'mxc-1 #jwq-1'
                      is_verified:
                        type: string
                        enum:
                        - '0'
                        - '1'
                        example: '1'
                      breeder:
                        type:
                        - string
                        - 'null'
                        example: null
                      archive:
                        type:
                        - object
                        - 'null'
                        title: Archive
                        description: Slim resource for archive, usually attached to other resources. Same as PetArchive
                        properties:
                          id:
                            type: integer
                            example: 1
                          reason:
                            type: string
                            example: The patient was archived because...
                          type:
                            type: string
                            enum:
                            - Deceased
                            - Moved away
                            - Change of owner
                            - Other
                            example: Deceased
                      patients:
                        type: array
                        items:
                          type: object
                          title: Patient
                          description: The patient entity represents the many-to-many link between a Pet and a Clinic. It holds information that is specific to the relationship between the pet and the clinic, such as the pet's status at that clinic, the internal number.
                          properties:
                            id:
                              type: integer
                              example: 1
                            pet_id:
                              type: integer
                              example: 1
                            clinic_id:
                              type: integer
                              example: 1
                            number:
                              type:
                              - string
                              - 'null'
                              example: DGT-102
                            archived_at:
                              type:
                              - string
                              - 'null'
                              format: date-time
                              example: '2020-08-16T08:56:44.000000Z'
                            archive_type_id:
                              type:
                              - integer
                              - 'null'
                              example: 1
                            archive_reason:
                              type:
                              - string
                              - 'null'
                              example: Pet deceased
                      birthday_estimated:
                        type: boolean
                        example: false
                      rabic_tag_number:
                        type: string
                        example: '12109384'
                      updated_at:
                        type: string
                        example: '2020-06-12 15:45:43'
                      insurance:
                        type: object
                        title: Insurance
                        description: Pet insurance information
                        properties:
                          id:
                            type: integer
                            example: 1
                          pet_id:
                            type: integer
                            example: 100
                          provider:
                            type: string
                            example: trupanion
                          policy_id:
                            type:
                            - string
                            - 'null'
                            example: abc-123-def
                          edo_status:
                            type:
                            - string
                            - 'null'
                            enum:
                            - pending
                            - active
                            - failed
                            - pending_reconfirmation
                            description: '`pending` - Certificate issued, awaiting activation

                              `active` - Certificate activated

                              `failed` - Certificate failed or expired

                              `pending_reconfirmation` - Pending reconfirmation by the pet owner

                              '
                            example: active
                          edo_last_sent_at:
                            type:
                            - string
                            - 'null'
                            format: date-time
                            example: '2026-05-05T10:00:00Z'
                          edo_activated_at:
                            type:
                            - string
                            - 'null'
                            format: date-time
                            example: '2026-05-06T09:00:00Z'
                          edo_reconfirmed_at:
                            type:
                            - string
                            - 'null'
                            format: date-time
                            example: null
        '400':
          $ref: '#/paths/~1api~1v1~1pets/get/responses/400'
        '401':
          $ref: '#/paths/~1api~1v1~1pets/get/responses/401'
        '403':
          $ref: '#/paths/~1api~1v1~1pets/get/responses/403'
        '429':
          $ref: '#/paths/~1api~1v1~1pets/get/responses/429'
      operationId: postApiV1Pets
      x-operation-id-source: derived
  /api/v1/pets/{id}:
    get:
      tags:
      - Pets
      summary: Retrieve a Pet
      description: 'Permissions needed: ACCESS_PATIENTS

        Returns a Pet record'
      parameters:
      - $ref: '#/paths/~1api~1v1~1sales/delete/parameters/0'
      - name: include
        in: query
        description: 'Additional info to include. You can use multiple, comma separated. Options: species,breed,trupanionSpecies,trupanionBreed,crossBreed,owners,owners.clients,owners.chatUser,clinics,vetPetRequests.clinic'
        required: false
        schema:
          type: string
      - name: append
        in: query
        description: 'Additional attributes to include(comma separated attributes. Ex: <i>hormonalStatusString,mandatoryScheme,weightEvolution<i/>)'
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/paths/~1api~1v1~1pets/post/responses/201/content/application~1json/schema/properties/data'
        '400':
          $ref: '#/paths/~1api~1v1~1pets/get/responses/400'
        '401':
          $ref: '#/paths/~1api~1v1~1pets/get/responses/401'
        '403':
          $ref: '#/paths/~1api~1v1~1pets/get/responses/403'
        '429':
          $ref: '#/paths/~1api~1v1~1pets/get/responses/429'
      operationId: getApiV1PetsById
      x-operation-id-source: derived
    post:
      tags:
      - Pets
      summary: Update a Pet
      description: 'Permissions needed: UPDATE_PATIENTS

        Update Pet by ID, empty values will overwrite, omit key to leave unchanged'
      parameters:
      - $ref: '#/paths/~1api~1v1~1sales/delete/parameters/0'
      - name: X-HTTP-METHOD-OVERRIDE
        in: header
        description: PATCH header
        required: true
        schema:
          type: string
          default: PATCH
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              allOf:
              - $ref: '#/paths/~1api~1v1~1pets~1%7Bid%7D/patch/requestBody/content/application~1json/schema'
              - type: object
                properties:
                  avatar:
                    description: Profile picture.
                    type: string
                    format: binary
                    example: avatar.jpg
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/paths/~1api~1v1~1pets/post/responses/201/content/application~1json/schema/properties/data'
        '400':
          $ref: '#/paths/~1api~1v1~1pets/get/responses/400'
        '401':
          $ref: '#/paths/~1api~1v1~1pets/get/responses/401'
        '403':
          $ref: '#/paths/~1api~1v1~1pets/get/responses/403'
        '429':
          $ref: '#/paths/~1api~1v1~1pets/get/responses/429'
      operationId: postApiV1PetsById
      x-operation-id-source: derived
    patch:
      tags:
      - Pets
      summary: Update a Pet (JSON)
      description: 'Permissions needed: UPDATE_PATIENTS

        Update Pet by ID, empty values will overwrite, omit key to leave unchanged.

        For text-only updates (no photo). To upload a new avatar, use the multipart/form-data operation on this same path instead, since file uploads are not delivered on a native PATCH request body.'
      parameters:
      - $ref: '#/paths/~1api~1v1~1sales/delete/parameters/0'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nickname:
                  description: Nickname
                  type: string
                  example: Fluffy
                birthday:
                  description: Birthday (Y-m-d)
                  type: string
                  example: '2017-11-28'
                species_id:
                  description: Species Id.
                  type:
                  - integer
                  - 'null'
                  example: 1
                breed_id:
                  description: Breed ID.
                  type: integer
                  example: 1
                crossbreed:
                  description: Set to true if crossbreed. Do not send empty value, omit the key completely
                  type: boolean
                crossbreed_details:
                  description: Crossbreed id (see breeds endpoint) Do not send empty value, omit the key completely
                  type: string
                color:
                  description: Color
                  type: string
                  example: Pink
                color_mask:
                  description: Color mask
                  type:
                  - array
                  - 'null'
                  items:
                    type: integer
                    example: 1
                distinctive_marks:
                  description: Distinctive marks
                  type: string
                  example: One spot on right ear
                gender:
                  description: Gender
                  type: string
                  enum:
                  - male
                  - female
                  - unknown
                observations:
                  description: Observations (Pet notes)
                  type:
                  - string
                  - 'null'
                chip_number:
                  description: Chip number
                  type:
                  - string
                  - 'null'
                  example: '123456789'
                microchip_location:
                  description: Microchip  Location
                  type:
                  - string
                  - 'null'
                  example: Neck
                insurance_number:
                  description: Insurance Number
                  type:
                  - string
                  - 'null'
                  example: '123456789'
                insurance_provider:
                  description: Insurance Provider
                  type:
                  - string
                  - 'null'
                  example: Petplan
                policy_id:
                  description: Policy ID
                  type:
                  - string
                  - 'null'
                  example: POLICY-123
                passport:
                  description: Passport
                  type:
                  - string
                  - 'null'
                  example: '123456789'
                description:
                  description: Description
                  type:
                  - string
                  - 'null'
                constitution:
                  description: Constitution
                  type: string
                conformation:
                  description: Conformation
                  type: string
                allergies:
                  description: Allergies
                  type: string
                blood_type_id:
                  description: Blood Type Id (see blood-types endpoint) Do not send empty value, omit the key completely
                  type: integer
                hormonal_status:
                  description: Hormonal Status (0=neutered,1=normal,2=unknown)
                  type: integer
                  enum:
