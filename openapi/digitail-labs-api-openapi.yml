openapi: 3.2.0
info:
  title: Digitail Labs API
  description: Digitail API
  contact:
    email: developer@digitail.io
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: 1.0.0
servers:
- url: https://developer.digitail.io
  description: Sandbox server (uses test data)
- url: https://vet.digitail.io
  description: Production server (uses live data)
security:
- passport: []
- Bearer: []
tags:
- name: Labs
  description: Endpoints for Labs
paths:
  /api/v1/integrations/labs/orders:
    get:
      tags:
      - Labs
      summary: Get all LabOrders
      description: 'Returns a list of lab orders for a clinic and optioanally includes their results.


        Permissions required:

        - VIEW_CHECKUPS'
      parameters:
      - $ref: '#/paths/~1api~1v1~1pets/get/parameters/0'
      - name: filter[file_case_id]
        in: query
        description: ID of the filecase from where the entity was created
        style: form
        explode: false
        schema:
          type: integer
      - $ref: '#/paths/~1api~1v1~1invoices/get/parameters/2'
      - name: include
        in: query
        description: 'A comma-separated list of additional data to include in the response.


          `result` - include result metadata


          `result.tests` - include discrete results


          `result.file` - include result file

          '
        schema:
          type: string
          enum:
          - result
          - result.tests
          - result.file
        example: result,result.tests,result.file
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      title: LabOrder
                      properties:
                        id:
                          type: integer
                        lab:
                          type: object
                          title: Lab
                          properties:
                            id:
                              type: integer
                            name:
                              type: string
                          example:
                            id: 1
                            name: Antech
                        clinic_id:
                          type: integer
                        file_case_id:
                          type: integer
                        vet_id:
                          type: integer
                        order_ext_id:
                          type: integer
                        status:
                          type: string
                          enum:
                          - none
                          - pending
                          - partial
                          - completed
                          - failed
                          - cancelled
                        ordered_tests:
                          type: array
                          items:
                            type: object
                            properties:
                              code:
                                type: string
                              name:
                                type: string
                        details:
                          type: object
                          properties:
                            ordering_ui_url:
                              type: string
                            is_editable:
                              type: boolean
                            has_requisition_form:
                              type: boolean
                            result_url:
                              type: string
                        result:
                          type: object
                          title: LabResult
                          properties:
                            id:
                              type: integer
                            ext_id:
                              type: string
                            reported_at:
                              type: string
                              format: date-time
                            file:
                              type: object
                              title: LabResultFile
                              properties:
                                name:
                                  type: string
                                url:
                                  type: string
                            tests:
                              type: array
                              items:
                                type: object
                                title: LabResultTest
                                properties:
                                  id:
                                    type: integer
                                  code:
                                    type: string
                                  name:
                                    type: string
                                  conclusion:
                                    type: string
                                  other_conclusion:
                                    type: string
                                  result:
                                    type: string
                                  unit:
                                    type: string
        '400':
          $ref: '#/paths/~1api~1v1~1pets/get/responses/400'
        '401':
          $ref: '#/paths/~1api~1v1~1pets/get/responses/401'
        '403':
          $ref: '#/paths/~1api~1v1~1pets/get/responses/403'
        '429':
          $ref: '#/paths/~1api~1v1~1pets/get/responses/429'
      operationId: getApiV1IntegrationsLabsOrders
      x-operation-id-source: derived
components:
  securitySchemes:
    passport:
      type: oauth2
      description: Laravel passport oauth2 security.
      flows:
        authorizationCode:
          authorizationUrl: https://developer.digitail.io/oauth/authorize
          tokenUrl: https://developer.digitail.io/oauth/token
          refreshUrl: https://developer.digitail.io/oauth/token
    Bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
